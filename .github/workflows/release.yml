name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from VERSION (for example, 0.1.0)
        required: true
        type: string

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/cagojeiger/d2-diagram-renderer
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify main CI and unpublished version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main" != "$SOURCE_SHA" ]]; then
            echo "::error::main has advanced. Dispatch the release from the latest main."
            exit 1
          fi

          version=$(cat VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$version" != "$REQUESTED_VERSION" ]]; then
            echo "::error::Requested version must match VERSION."
            exit 1
          fi

          passed=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$SOURCE_SHA" --status success --limit 1 --json headSha \
            --jq '.[0].headSha // empty')
          if [[ "$passed" != "$SOURCE_SHA" ]]; then
            echo "::error::CI has not passed for this main commit."
            exit 1
          fi

          tag="v$version"
          published=$(git ls-remote origin "refs/tags/$tag")
          if [[ -n "$published" ]]; then
            echo "::error::$tag already exists."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the release candidate
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Smoke-test both architectures by digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          index=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          for arch in amd64 arm64; do
            child_digest=$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else error("Expected one manifest for linux/" + $arch) end
            ' <<< "$index")
            bash .github/scripts/smoke-image.sh "$IMAGE@$child_digest" "linux/$arch"
          done
      - name: Publish the tested digest and GitHub release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          test "$main" = "$SOURCE_SHA"
          published=$(git ls-remote origin "refs/tags/$TAG")
          test -z "$published"
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          gh release create "$TAG" --target "$SOURCE_SHA" --generate-notes \
            --title "$TAG" \
            --notes "Container image: \`$IMAGE:$TAG@$DIGEST\`"
